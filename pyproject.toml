[project]
name = "rentalops-agent"
version = "0.1.0"
description = "Agente RentalOps com LangGraph, FastAPI e streaming SSE."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
rentalops-agent = "rentalops_agent:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
