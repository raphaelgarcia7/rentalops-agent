[project]
name = "rentalops-backend"
version = "0.1.0"
description = "Backend API for RentalOps, a system for event-decoration rentals."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.54,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.18,<2",
    "python-dotenv>=1.2,<2",
    "argon2-cffi>=25.1,<26",
    "pillow>=12.1,<13",
    "phonenumbers>=9,<10",
    "portalocker>=3.2,<4",
]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.19", "pytest>=9", "httpx>=0.28", "pip-audit>=2.9"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["backend/src", "infra/operations"]
strict = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".."]
markers = ["integration: requires a dedicated local PostgreSQL test database"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rentalops_api"
