worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Deliberately omit request URI, query, remote IP, Referer and all headers.
    log_format operations escape=json '{"request_id":"$request_id","operation":"proxy","method":"$request_method","duration_seconds":"$request_time","code":$status,"error_category":"$upstream_status"}';
    access_log /dev/stdout operations;
    client_max_body_size 11m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_hide_header Server;
            proxy_read_timeout 30s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
